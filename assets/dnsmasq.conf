# Halo Appliance DHCP Config
# Listen on the BRIDGE (br0), not wlan0
interface=br0
# Serve IPs in the 10.0.0.x range (matching the bridge IP)
dhcp-range=10.0.0.50,10.0.0.150,255.255.255.0,12h
domain=halo.local
# Gateway is the Pi itself (10.0.0.1)
address=/gw.halo.local/10.0.0.1
# Option 3: Default Gateway
dhcp-option=3,10.0.0.1
# Option 6: DNS Server (Pi itself)
dhcp-option=6,10.0.0.1